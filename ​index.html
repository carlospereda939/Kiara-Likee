<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b0b12" />
  <title>Kiara Likee – Ven y vive la experiencia.</title>
  <link rel="manifest" href="manifest.json" />
  <style>
    :root {
      --bg: #0b0b12;
      --card: #161624;
      --text: #ffffff;
      --muted: #b8b8d0;
      --grad: linear-gradient(135deg, #00e5ff 0%, #9d4edd 42%, #ff2a85 75%, #ff3b30 100%);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Pantalla de carga chibi */
    #loader {
      position: fixed;
      inset: 0;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      z-index: 9999;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }

    #loader.hidden {
      opacity: 0;
      visibility: hidden;
    }

    .chibi-box {
      width: 92px;
      height: 92px;
      border-radius: 50%;
      background: var(--grad);
      padding: 4px;
      animation: bounceChibi 1.1s infinite ease-in-out;
      box-shadow: 0 0 28px rgba(255, 42, 133, 0.35);
    }

    .chibi-inner {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: #12121d;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 38px;
      font-weight: 800;
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      background-image: var(--grad);
    }

    @keyframes bounceChibi {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-10px) scale(1.05); }
    }

    .loader-text {
      font-size: 14px;
      color: var(--muted);
      letter-spacing: 0.4px;
    }

    /* Encabezado y marca */
    header {
      padding: 24px 18px 14px;
      text-align: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      background: radial-gradient(circle at top, rgba(157, 78, 221, 0.18), transparent 70%);
    }

    .brand-row {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 8px;
    }

    .logo-k {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: var(--grad);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      font-weight: 900;
      color: #ffffff;
      box-shadow: 0 6px 20px rgba(0, 229, 255, 0.25);
    }

    h1 {
      font-size: 28px;
      font-weight: 800;
      background: var(--grad);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .subtitle {
      color: var(--muted);
      font-size: 15px;
      margin-bottom: 16px;
    }

    .actions {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      border: none;
      border-radius: 999px;
      padding: 10px 18px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      color: #ffffff;
      background: var(--grad);
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    .btn:active {
      transform: scale(0.96);
    }

    .btn-secondary {
      background: #222236;
      border: 1px solid rgba(255, 255, 255, 0.14);
    }

    /* Catálogos */
    main {
      max-width: 900px;
      margin: 0 auto;
      padding: 22px 16px 48px;
    }

    .section-title {
      font-size: 19px;
      font-weight: 700;
      margin: 22px 0 12px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 14px;
    }

    .item-card {
      background: var(--card);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 10px;
    }

    .item-emoji {
      font-size: 28px;
    }

    .item-name {
      font-size: 16px;
      font-weight: 700;
    }

    .item-desc {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.4;
    }

    .item-price {
      font-size: 14px;
      font-weight: 700;
      color: #00e5ff;
    }

    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: #1e1e30;
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.16);
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 14px;
      opacity: 0;
      transition: all 0.25s ease;
      z-index: 10000;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>
  <div id="loader">
    <div class="chibi-box">
      <div class="chibi-inner">K</div>
    </div>
    <p class="loader-text">Cargando Kiara Likee...</p>
  </div>

  <header>
    <div class="brand-row">
      <div class="logo-k">K</div>
      <h1>Kiara Likee</h1>
    </div>
    <p class="subtitle">Ven y vive la experiencia.</p>
    <div class="actions">
      <button class="btn" id="shareBtn" type="button">Compartir app</button>
      <button class="btn btn-secondary" id="reloadLoaderBtn" type="button">Ver animación</button>
    </div>
  </header>

  <main>
    <h2 class="section-title">Catálogo de Regalos</h2>
    <div class="grid" id="giftsGrid"></div>

    <h2 class="section-title">Catálogo de Monedas</h2>
    <div class="grid" id="coinsGrid"></div>
  </main>

  <div class="toast" id="toast"></div>

  <script>
    const gifts = [
      { emoji: "🌹", name: "Rosa Neón", desc: "Destaca en transmisiones con un toque brillante.", price: "10 monedas" },
      { emoji: "⚡", name: "Rayo Estelar", desc: "Efecto rápido para animar la comunidad.", price: "50 monedas" },
      { emoji: "👑", name: "Corona VIP", desc: "Un detalle especial para los momentos clave.", price: "200 monedas" },
      { emoji: "🎆", name: "Fuegos de Gala", desc: "Celebración visual en pantalla completa.", price: "500 monedas" }
    ];

    const coins = [
      { emoji: "🪙", name: "Paquete Inicial", desc: "Ideal para empezar a enviar regalos.", price: "100 monedas" },
      { emoji: "💎", name: "Paquete Popular", desc: "Más monedas para tus creadores favoritos.", price: "550 monedas" },
      { emoji: "🚀", name: "Paquete Turbo", desc: "Carga extra para eventos especiales.", price: "1,200 monedas" },
      { emoji: "🌟", name: "Paquete Supremo", desc: "Gran reserva para destacar siempre.", price: "2,600 monedas" }
    ];

    const giftsGrid = document.getElementById("giftsGrid");
    const coinsGrid = document.getElementById("coinsGrid");
    const loader = document.getElementById("loader");
    const toast = document.getElementById("toast");

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 2400);
    }

    function renderCatalog() {
      giftsGrid.innerHTML = gifts.map((item) => `
        <article class="item-card">
          <div class="item-emoji">${item.emoji}</div>
          <div class="item-name">${item.name}</div>
          <p class="item-desc">${item.desc}</p>
          <div class="item-price">${item.price}</div>
        </article>
      `).join("");

      coinsGrid.innerHTML = coins.map((item) => `
        <article class="item-card">
          <div class="item-emoji">${item.emoji}</div>
          <div class="item-name">${item.name}</div>
          <p class="item-desc">${item.desc}</p>
          <div class="item-price">${item.price}</div>
        </article>
      `).join("");
    }

    function hideLoader() {
      setTimeout(() => loader.classList.add("hidden"), 700);
    }

    document.getElementById("reloadLoaderBtn").addEventListener("click", () => {
      loader.classList.remove("hidden");
      hideLoader();
    });

    document.getElementById("shareBtn").addEventListener("click", async () => {
      const shareData = {
        title: "Kiara Likee",
        text: "Kiara Likee – Ven y vive la experiencia.",
        url: window.location.href
      };

      if (navigator.share) {
        try {
          await navigator.share(shareData);
        } catch (_) {}
      } else if (navigator.clipboard) {
        await navigator.clipboard.writeText(window.location.href);
        showToast("Enlace copiado al portapapeles");
      } else {
        showToast("Copia la dirección desde la barra del navegador");
      }
    });

    renderCatalog();
    window.addEventListener("load", hideLoader);
  </script>
</body>
</html>
